<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <style>
      /* Reset and base */
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background-color: #101010;
        color: white;
        font-family: 'Arial', sans-serif;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 20px;
        min-height: 100vh;
        text-align: center;
      }

      h1, h2 {
        color: #fff;
        margin-bottom: 30px;
      }

      input {
        padding: 0.9em 1.1em;
        border: 1px solid #1e2d3d;
        border-radius: 8px;
        background: #0a0f16;
        color: white;
        font-size: 1em;
        outline: none;
        transition: all 0.3s ease;
      }

      input:focus {
        border-color: #4f9cff;
        background: #0d1419;
        box-shadow: 0 0 0 3px rgba(79, 156, 255, 0.1);
      }

      button {
        padding: 0.9em 1.5em;
        background: linear-gradient(135deg, #4f9cff 0%, #3a7fd5 100%);
        border: none;
        border-radius: 8px;
        color: white;
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 15px rgba(79, 156, 255, 0.3);
        letter-spacing: 0.3px;
        margin-top: 15px;
      }

      button:hover {
        background: linear-gradient(135deg, #5faeff 0%, #4a8fe5 100%);
        box-shadow: 0 6px 20px rgba(79, 156, 255, 0.4);
        transform: translateY(-1px);
      }

      button:active {
        transform: translateY(0);
        box-shadow: 0 2px 10px rgba(79, 156, 255, 0.3);
      }

      .status {
        font-size: 2em;
        margin-top: 30px;
        color: #4f9cff;
      }

      .message {
        margin-top: 15px;
        font-size: 1em;
        color: #aaa;
      }z

    .media {
      width: 200px;           /* reasonable default size */
      height: 200px;          /* square container */
      object-fit: cover;      /* crop/scale nicely */
      border-radius: 50%;     /* circular */
      box-shadow: 0 8px 20px rgba(79, 156, 255, 0.3); /* subtle glow */
      margin-bottom: 30px;    /* spacing from content */
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .media:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 30px rgba(79, 156, 255, 0.5);
    }

    @media (max-width: 480px) {
      .media {
        width: 150px;
        height: 150px;
        margin-bottom: 20px;
      }
    }
    .loader {
      width: 40px;
      height: 40px;
      margin-bottom: 25px;
      border: 4px solid rgba(79, 156, 255, 0.2);
      border-top: 4px solid #4f9cff;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    .hidden {
      display: none;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
  </style>
  </head>

  <body>
    <img class='media' src="https://media.gettyimages.com/id/1154618548/photo/in-this-handout-provided-by-the-florida-department-of-law-enforcement-jeffrey-epstein-poses.jpg?s=612x612&w=0&k=20&c=Y8mLoBhck0WLuHSj-VtaLcWU04mySh5DjM0TrCECH_Y=" alt=''>
    <div id="loader" class="loader hidden"></div>
    <div id="app"></div>

    <script>
    const app = document.getElementById("app");
    const loader = document.getElementById("loader");
    function showLoading() { loader.classList.remove("hidden"); }
    function hideLoading() { loader.classList.add("hidden"); }

    let deviceId = localStorage.getItem("device_id");
    if (!deviceId) { deviceId = crypto.randomUUID(); localStorage.setItem("device_id", deviceId); }
    let name = localStorage.getItem("user_name");

    if (!name) {
      app.innerHTML = `
        <h2>Register your device w/ your name.</h2>
        <input id="nameInput" placeholder="Your name" />
        <br><button onclick="saveName()">Continue</button>
      `;
    } else {
      toggle();
    }

    function saveName() {
      const input = document.getElementById("nameInput");
      if (!input.value.trim()) return;
      name = input.value.trim();
      localStorage.setItem("user_name", name);
      toggle();
    }

    async function toggle() {
      showLoading();
      try {
        const res = await fetch("YOUR_APPS_SCRIPT_EXEC_URL", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ deviceId, name })
        });
        const data = await res.json();
        showResult(data.status);
      } catch (err) {
        app.innerHTML = `<div class="status">Error: ${err.message}</div>`;
      } finally {
        hideLoading();
      }
    }

    function showResult(status) {
      app.innerHTML = `
        <div class="status">${status === "IN" ? "Signed IN" : "Signed OUT"}</div>
        <div class="message">You can close the tab now.</div>
      `;
    }
    </script>
  </body>
</html>
